# Build the Vite site and publish dist/ to Hostinger public_html over FTP.
# Shared hosting serves static files + PHP; Node is not used at runtime.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optional Actions variables:
#   FTP_SERVER_DIR   default /public_html/
#   FTP_PROTOCOL     ftp | ftps | ftps-legacy   default ftp
#   FTP_PORT         default 21
# Optional secrets baked into the JS bundle:
#   VITE_GOOGLE_CLIENT_ID, VITE_GOOGLE_ALLOWED_EMAILS,
#   VITE_UNSPLASH_ACCESS_KEY, VITE_BOOKING_URL
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the FTP sync without writing files on the host
        type: boolean
        default: false

concurrency:
  group: hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and publish public_html
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tygrventures.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_ALLOWED_EMAILS: ${{ secrets.VITE_GOOGLE_ALLOWED_EMAILS }}
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          VITE_BOOKING_URL: ${{ secrets.VITE_BOOKING_URL }}
        run: npm run build

      - name: Exclude live CMS files
        run: bash scripts/prepare-hostinger-dist.sh dist

      - name: Require FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Publish dist/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          dry-run: ${{ inputs.dry_run == true }}
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/content.json
            **/uploads/**
            **/api/config.php
            **/.env
            **/.env.*
