# Build the Vite site and publish dist/ to Hostinger public_html over FTP.
# Shared hosting serves static files + PHP; Node is not used at runtime.
#
# Required GitHub Actions secret (Settings → Secrets and variables → Actions):
#   FTP_PASSWORD     Hostinger FTP password for u764653958
# Connection (from hPanel → FTP Accounts):
#   server 82.25.82.89  user u764653958  dir /public_html/
# Optional secrets baked into the JS bundle:
#   VITE_GOOGLE_CLIENT_ID, VITE_GOOGLE_ALLOWED_EMAILS,
#   VITE_UNSPLASH_ACCESS_KEY, VITE_BOOKING_URL
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the FTP sync without writing files on the host
        type: boolean
        default: false

concurrency:
  group: hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and publish public_html
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tygrventures.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_ALLOWED_EMAILS: ${{ secrets.VITE_GOOGLE_ALLOWED_EMAILS }}
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          VITE_BOOKING_URL: ${{ secrets.VITE_BOOKING_URL }}
        run: npm run build

      - name: Exclude live CMS files
        run: bash scripts/prepare-hostinger-dist.sh dist

      - name: Require FTP password
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_PASSWORD is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Publish dist/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: 82.25.82.89
          username: u764653958
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          dry-run: ${{ inputs.dry_run == true }}
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/content.json
            **/uploads/**
            **/api/config.php
            **/.env
            **/.env.*
